{% extends 'admin/base.html' %}

{% block title %}Add Product{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add New Product</h1>
    <a href="{{ url_for('admin_product.admin_products') }}" class="btn btn-modern btn-modern-light"><i class="bi bi-arrow-left"></i> Back to Products</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
        <div class="card card-modern p-4">
            <form action="{{ url_for('admin_product.add_product') }}" method="POST">
                <div class="row g-4">
                    <div class="col-md-12">
                        <label class="form-label fw-semibold text-muted">Title</label>
                        <input type="text" name="title" class="form-control bg-light" required style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-muted">Price ($)</label>
                        <input type="number" step="0.01" name="price" class="form-control bg-light" required style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-muted">Category</label>
                        <input type="text" name="category" class="form-control bg-light" required style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-semibold text-muted">Image URL</label>
                        <input type="url" name="image" class="form-control bg-light" style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-5">
                    <a href="{{ url_for('admin_product.admin_products') }}" class="btn btn-modern btn-modern-light">Cancel</a>
                    <button type="submit" class="btn btn-modern btn-modern-primary">Add Product</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
