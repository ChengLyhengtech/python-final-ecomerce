{% extends 'admin/base.html' %}

{% block title %}Categories{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Categories</h1>
    <a href="/admin/categories/add" class="btn btn-modern btn-modern-primary"><i class="bi bi-plus-lg"></i> Add New Category</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
        <div class="table-modern">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Category Name</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for category in categories %}
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center"
                                    style="width: 40px; height: 40px;">
                                    <i class="bi bi-tag-fill fs-5"></i>
                                </div>
                                <span class="text-capitalize fw-semibold fs-6">{{ category }}</span>
                            </div>
                        </td>
                        <td class="text-end">
                            <div class="d-flex justify-content-end gap-2">
                                <a href="/admin/categories/edit/{{ loop.index }}" class="btn btn-sm btn-modern btn-modern-light"><i class="bi bi-pencil"></i> Edit</a>
                                <button type="button" class="btn btn-sm btn-modern btn-modern-danger" data-bs-toggle="modal" data-bs-target="#deleteConfirmModal" data-url="/admin/categories/delete/{{ loop.index }}" data-name="{{ category | e }}" data-type="category"><i class="bi bi-trash"></i> Delete</button>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
