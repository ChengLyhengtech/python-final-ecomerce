<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - {% block title %}Dashboard{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --admin-bg: #f3f4f6;
            --admin-sidebar: #111827;
            --admin-sidebar-hover: #1f2937;
            --admin-primary: #4f46e5;
            --admin-text-main: #1f2937;
            --admin-text-muted: #6b7280;
        }
        body { 
            font-family: 'Inter', sans-serif;
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            background-color: var(--admin-bg);
            color: var(--admin-text-main);
        }
        /* Navbar */
        .admin-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            height: 60px;
        }
        .admin-navbar .navbar-brand {
            font-weight: 700;
            color: var(--admin-sidebar);
            background-color: transparent;
            box-shadow: none;
            display: flex;
            align-items: center;
        }
        .admin-navbar .nav-link {
            color: var(--admin-text-muted);
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .admin-navbar .nav-link:hover {
            color: var(--admin-primary);
        }
        
        /* Sidebar */
        .sidebar { 
            min-height: calc(100vh - 60px); 
            background-color: var(--admin-sidebar) !important;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 100;
        }
        @media (max-width: 767.98px) {
            .sidebar {
                position: fixed;
                top: 60px;
                left: -250px;
                width: 250px;
                height: calc(100vh - 60px);
                transition: left 0.3s ease;
                display: block !important;
                z-index: 1050;
            }
            .sidebar.mobile-show {
                left: 0;
            }
        }
        .sidebar .nav-link { 
            color: #9ca3af; 
            font-weight: 500;
            padding: 0.75rem 1rem;
            margin-bottom: 0.25rem;
            border-radius: 0.375rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }
        .sidebar .nav-link i {
            font-size: 1.1rem;
            color: #6b7280;
            transition: color 0.2s ease;
        }
        .sidebar .nav-link.active { 
            color: #ffffff; 
            background-color: var(--admin-primary); 
        }
        .sidebar .nav-link.active i {
            color: #ffffff;
        }
        .sidebar .nav-link:hover:not(.active) { 
            color: #ffffff; 
            background-color: var(--admin-sidebar-hover);
        }
        .sidebar .nav-link:hover:not(.active) i {
            color: #d1d5db;
        }

        main { flex: 1; }
        
        /* Utility Classes for modern look */
        .card-modern {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background-color: #ffffff;
        }
        .card-modern:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .table-modern {
            background: #ffffff;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        .table-modern table { margin-bottom: 0; border-collapse: separate; border-spacing: 0; }
        .table-modern th { 
            background-color: #f9fafb; 
            color: #6b7280; 
            font-weight: 600; 
            text-transform: uppercase; 
            font-size: 0.75rem; 
            letter-spacing: 0.05em; 
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 1.5rem;
        }
        .table-modern td {
            padding: 1rem 1.5rem;
            vertical-align: middle;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
        }
        .table-modern tbody tr:last-child td { border-bottom: none; }
        .table-modern tbody tr:hover { background-color: #f9fafb; }
        
        .badge-soft-primary { background-color: #e0e7ff; color: #4338ca; border: none; }
        .badge-soft-success { background-color: #d1fae5; color: #047857; border: none; }
        .badge-soft-info { background-color: #cffafe; color: #0369a1; border: none; }
        .badge-soft-warning { background-color: #fef3c7; color: #b45309; border: none; }
        .badge-soft-secondary { background-color: #f3f4f6; color: #4b5563; border: none; }

        .btn-modern {
            border-radius: 0.375rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .btn-modern:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .btn-modern-primary { background-color: var(--admin-primary); color: white; border: none; }
        .btn-modern-primary:hover { background-color: #4338ca; color: white; }
        .btn-modern-danger { background-color: #fee2e2; color: #ef4444; border: none; }
        .btn-modern-danger:hover { background-color: #fecaca; color: #dc2626; }
        .btn-modern-info { background-color: #e0f2fe; color: #0ea5e9; border: none; }
        .btn-modern-info:hover { background-color: #bae6fd; color: #0284c7; }
        .btn-modern-light { background-color: #ffffff; color: #374151; border: 1px solid #d1d5db; }
        .btn-modern-light:hover { background-color: #f9fafb; color: #111827; }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111827;
            margin: 0;
        }
    </style>
</head>
<body>

    {%  include 'admin/shared/header.html' %}

    <div class="container-fluid">
        <div class="row">
            <!-- Include Sidebar -->
            {% include 'admin/shared/sidebar.html' %}

            <!-- Main Page Content Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 transition-all" id="mainContent" style="transition: all 0.3s ease;">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Include Footer -->
    {% include 'admin/shared/footer.html' %}

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebarToggleMobile = document.getElementById('sidebarToggleMobile');
            const sidebarMenu = document.getElementById('sidebarMenu');
            const mainContent = document.getElementById('mainContent');
            const footer = document.querySelector('.footer');
            
            // Desktop toggle
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (sidebarMenu.classList.contains('d-md-block')) {
                        // Collapse sidebar
                        sidebarMenu.classList.remove('d-md-block');
                        sidebarMenu.classList.add('d-md-none');
                        
                        // Expand main content
                        mainContent.classList.remove('col-md-9', 'col-lg-10', 'ms-sm-auto');
                        mainContent.classList.add('col-12');
                        
                        if(footer) {
                            footer.classList.remove('col-md-9', 'col-lg-10', 'ms-sm-auto');
                            footer.classList.add('col-12');
                        }
                    } else {
                        // Show sidebar
                        sidebarMenu.classList.remove('d-md-none');
                        sidebarMenu.classList.add('d-md-block');
                        
                        // Shrink main content
                        mainContent.classList.remove('col-12');
                        mainContent.classList.add('col-md-9', 'col-lg-10', 'ms-sm-auto');
                        
                        if(footer) {
                            footer.classList.remove('col-12');
                            footer.classList.add('col-md-9', 'col-lg-10', 'ms-sm-auto');
                        }
                    }
                });
            }
            
            // Mobile toggle
            if (sidebarToggleMobile) {
                sidebarToggleMobile.addEventListener('click', function(e) {
                    e.preventDefault();
                    sidebarMenu.classList.toggle('mobile-show');
                });
            }
        });
    </script>
    {% include 'admin/shared/_toasts.html' %}
    {% include 'admin/shared/_delete_modal.html' %}
</body>
</html>
