{% extends 'admin/base.html' %}

{% block title %}Edit Category{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Category</h1>
    <a href="{{ url_for('admin_categories') }}" class="btn btn-modern btn-modern-light"><i class="bi bi-arrow-left"></i> Back to Categories</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-modern p-4">
            <form action="#" method="POST">
                <div class="mb-4">
                    <label for="categoryName" class="form-label fw-semibold text-muted">Category Name</label>
                    <input type="text" class="form-control form-control-lg bg-light" id="categoryName"
                        name="category_name" value="{{ category }}" required
                        style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('admin_categories') }}" class="btn btn-modern btn-modern-light">Cancel</a>
                    <button type="submit" class="btn btn-modern btn-modern-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
