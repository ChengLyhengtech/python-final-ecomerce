{% extends 'admin/base.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}
<div class="page-header mb-4">
    <h1>Edit User</h1>
    <a href="{{ url_for('admin_user.admin_users') }}" class="btn btn-modern btn-modern-light">
        <i class="bi bi-arrow-left"></i> Back to Users
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-modern p-4 shadow-sm">
            <form action="{{ url_for('admin_user.edit_user', user_id=user.id) }}" method="POST" enctype="multipart/form-data">

                <!-- Profile Image Upload Section -->
                <div class="mb-4 text-center">
                    <label for="profileUpload" class="position-relative d-inline-block" style="cursor: pointer;">
                        <img id="profilePreview"
                             src="{% if user.profile_image and user.profile_image != 'no-profile.png' %}{{ url_for('static', filename='admin/uploads/' ~ user.profile_image) }}{% else %}{{ url_for('static', filename='admin/img/no-profile.png') }}{% endif %}"
                             alt="Profile Preview"
                             class="rounded-circle border"
                             style="width: 120px; height: 120px; object-fit: cover;">

                        <span class="position-absolute bottom-0 end-0 bg-primary text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm"
                               style="width: 32px; height: 32px; border: 2px solid white;">
                            <i class="bi bi-camera-fill" style="font-size: 0.875rem;"></i>
                        </span>

                        <input type="file" id="profileUpload" name="profile" accept="image/*" class="d-none">
                    </label>
                    <div class="text-muted small mt-2">Change Profile Photo</div>
                </div>

                <!-- Username Field -->
                <div class="mb-4">
                    <label for="userName" class="form-label fw-semibold text-muted">Username <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-lg bg-light" id="userName"
                        name="username" value="{{ user.username }}" required
                        style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                </div>

                <!-- Email Field -->
                <div class="mb-4">
                    <label for="userEmail" class="form-label fw-semibold text-muted">Email Address <span class="text-danger">*</span></label>
                    <input type="email" class="form-control form-control-lg bg-light" id="userEmail"
                        name="email" value="{{ user.email }}" required
                        style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                </div>

                <!-- Password Field (Optional on edit) -->
                <div class="mb-4">
                    <label for="userPassword" class="form-label fw-semibold text-muted">New Password (Leave blank to keep current)</label>
                    <input type="password" class="form-control form-control-lg bg-light" id="userPassword"
                        name="password" placeholder="Enter new password if changing" minlength="6"
                        style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                </div>

                <!-- Phone Number Field -->
                <div class="mb-4">
                    <label for="userPhone" class="form-label fw-semibold text-muted">Phone Number</label>
                    <input type="text" class="form-control form-control-lg bg-light" id="userPhone"
                        name="phone_number" value="{{ user.phone_number or '' }}"
                        placeholder="e.g. +855 12 345 678"
                        style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                </div>

                <!-- Role Dropdown -->
                <div class="mb-4">
                    <label for="userRole" class="form-label fw-semibold text-muted">Role <span class="text-danger">*</span></label>
                    <select class="form-select form-select-lg bg-light" id="userRole" name="role" required
                        style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                        <option value="admin" {% if user.role|lower == 'admin' %}selected{% endif %}>Admin</option>
                        <option value="staff" {% if user.role|lower == 'staff' %}selected{% endif %}>Staff</option>
                        <option value="editor" {% if user.role|lower == 'editor' %}selected{% endif %}>Editor</option>
                        <option value="user" {% if user.role|lower == 'user' or user.role|lower not in ['admin', 'staff', 'editor'] %}selected{% endif %}>User</option>
                    </select>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-5">
                    <a href="{{ url_for('admin_user.admin_users') }}" class="btn btn-modern btn-modern-light">Cancel</a>
                    <button type="submit" class="btn btn-modern btn-modern-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block content_scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var profileUpload = document.getElementById('profileUpload');
        var profilePreview = document.getElementById('profilePreview');
        if (profileUpload && profilePreview) {
            profileUpload.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(event) {
                        profilePreview.setAttribute('src', event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    });
</script>
{% endblock %}
