{% extends 'admin/base.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit User</h1>
    <a href="{{ url_for('admin_users') }}" class="btn btn-modern btn-modern-light"><i class="bi bi-arrow-left"></i> Back to Users</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-modern p-4">
            <form action="{{ url_for('edit_user', user_id=user.id) }}" method="POST" enctype="multipart/form-data">
                <div class="mb-4 text-center">
                    <div class="position-relative d-inline-block">
                        <img id="profilePreview" src="{{ user.profile or '/static/admin/img/no-profile.png' }}" alt="Profile Preview" class="rounded-circle border" style="width: 120px; height: 120px; object-fit: cover;">
                        <label for="profileUpload" class="position-absolute bottom-0 end-0 bg-primary text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 32px; height: 32px; cursor: pointer; border: 2px solid white;">
                            <i class="bi bi-camera-fill" style="font-size: 0.875rem;"></i>
                        </label>
                        <input type="file" id="profileUpload" name="profile" accept="image/*" class="d-none">
                    </div>
                    <div class="text-muted small mt-2">Upload Profile Photo</div>
                </div>
                <div class="mb-4">
                    <label for="userName" class="form-label fw-semibold text-muted">Full Name</label>
                    <input type="text" class="form-control form-control-lg bg-light" id="userName"
                        name="name" value="{{ user.name }}" required
                        style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                </div>
                <div class="mb-4">
                    <label for="userEmail" class="form-label fw-semibold text-muted">Email Address</label>
                    <input type="email" class="form-control form-control-lg bg-light" id="userEmail"
                        name="email" value="{{ user.email }}" required
                        style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                </div>
                <div class="mb-4">
                    <label for="userRole" class="form-label fw-semibold text-muted">Role</label>
                    <select class="form-select form-select-lg bg-light" id="userRole" name="role" required
                        style="border-radius: 0.5rem; border: 1px solid #e5e7eb;">
                        <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin</option>
                        <option value="Editor" {% if user.role == 'Editor' %}selected{% endif %}>Editor</option>
                        <option value="User" {% if user.role == 'User' or user.role not in ['Admin', 'Editor'] %}selected{% endif %}>User</option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-5">
                    <a href="{{ url_for('admin_users') }}" class="btn btn-modern btn-modern-light">Cancel</a>
                    <button type="submit" class="btn btn-modern btn-modern-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
{% block content_scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var profileUpload = document.getElementById('profileUpload');
        var profilePreview = document.getElementById('profilePreview');
        if (profileUpload && profilePreview) {
            profileUpload.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(event) {
                        profilePreview.setAttribute('src', event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    });
</script>
{% endblock %}
{% endblock %}
