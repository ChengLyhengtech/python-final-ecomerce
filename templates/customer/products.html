{% extends "customer/layout.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">
    
    <!-- Sidebar / Filters -->
    <aside class="w-full lg:w-64 flex-shrink-0 space-y-6">
        <!-- Categories -->
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
            <h4 class="text-lg font-bold text-slate-900 mb-4 pb-3 border-b border-slate-100">Categories</h4>
            <ul class="space-y-3">
                <li>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" name="category" value="men's clothing" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer"> 
                        <span class="text-sm text-slate-600 group-hover:text-indigo-600 transition-colors">Men's Clothing</span>
                    </label>
                </li>
                <li>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" name="category" value="women's clothing" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer"> 
                        <span class="text-sm text-slate-600 group-hover:text-indigo-600 transition-colors">Women's Clothing</span>
                    </label>
                </li>
                <li>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" name="category" value="jewelery" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer"> 
                        <span class="text-sm text-slate-600 group-hover:text-indigo-600 transition-colors">Jewelry</span>
                    </label>
                </li>
                <li>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" name="category" value="electronics" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer"> 
                        <span class="text-sm text-slate-600 group-hover:text-indigo-600 transition-colors">Electronics</span>
                    </label>
                </li>
            </ul>
        </div>

        <!-- Price Range -->
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
            <h4 class="text-lg font-bold text-slate-900 mb-4 pb-3 border-b border-slate-100">Price Range</h4>
            <div class="flex items-center gap-2 mb-4">
                <input type="number" placeholder="Min" name="min_price" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                <span class="text-slate-400">-</span>
                <input type="number" placeholder="Max" name="max_price" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <button class="w-full py-2.5 bg-slate-900 hover:bg-indigo-600 text-white text-sm font-semibold rounded-lg transition-all shadow-sm">Apply Filter</button>
        </div>
    </aside>

    <!-- Main Content -->
    <section class="flex-1 space-y-6">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-200">
            <h2 class="text-2xl font-bold tracking-tight text-slate-900">All Products Matrix</h2>
            <div class="relative">
                <select class="appearance-none bg-white border border-slate-300 text-slate-700 py-2 pl-4 pr-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm font-medium shadow-sm cursor-pointer">
                    <option>Default Sorting</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                    <i class="fas fa-chevron-down text-xs"></i>
                </div>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
            {% for itm in item %}
            <div class="group flex flex-col bg-white rounded-xl overflow-hidden border border-slate-200/80 shadow-sm hover:shadow-xl hover:border-slate-300 transform hover:-translate-y-1 transition-all duration-300">

                <!-- Product Image Window -->
                <div class="relative bg-slate-100 aspect-square overflow-hidden w-full p-4">
                    <a href="{{ url_for('view_product', item_id=itm.id) }}" class="block w-full h-full">
                        <img src="{{ itm.image }}" alt="{{ itm.title }}" class="w-full h-full object-contain object-center transform group-hover:scale-105 transition-transform duration-500 ease-in-out mix-blend-multiply">
                    </a>
                </div>

                <!-- Product Text Configurations -->
                <div class="p-4 flex-grow flex flex-col justify-between space-y-2">
                    <div>
                        <p class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">{{ itm.category }}</p>
                        <h4 class="text-sm font-semibold text-slate-800 line-clamp-2 group-hover:text-indigo-600 transition-colors leading-snug">
                            <a href="{{ url_for('view_product', item_id=itm.id) }}">{{ itm.title }}</a>
                        </h4>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <span class="text-base sm:text-lg font-bold text-slate-900">${{ "%.2f"|format(itm.price) }}</span>
                        <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800">
                            ★ {{ itm.rating.rate }}
                        </span>
                    </div>
                </div>

                <!-- Action Button Matrix Footer -->
               <div class="p-3 pt-0 grid grid-cols-3 gap-2 border-t border-slate-50 mt-auto">
                    <button class="inline-flex justify-center items-center py-2 rounded-lg bg-slate-50 text-slate-600 hover:bg-rose-50 hover:text-rose-600 transition-colors duration-200" title="Add to Favourites">
                        <i class="far fa-heart"></i>
                    </button>

                    <a href="{{ url_for('view_product', item_id=itm.id) }}" class="inline-flex justify-center items-center py-2 rounded-lg bg-slate-50 text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors duration-200" title="View Details">
                        <i class="fas fa-search"></i>
                    </a>

                    <form action="{{ url_for('add_to_cart', item_id=itm.id) }}" method="POST" class="w-full">
                        <button type="submit" class="w-full inline-flex justify-center items-center py-2 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white transition-all duration-200" title="Add to Cart">
                            <i class="fas fa-shopping-cart"></i>
                        </button>
                    </form>
                </div>

            </div>
            {% endfor %}
        </div>
    </section>
</div>
{% endblock %}
