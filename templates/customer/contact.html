{% extends "customer/layout.html" %}

{% block content %}
<div class="container">
    <section class="contact-page">
        <div class="contact-header">
            <h2>Get In Touch</h2>
            <p>Have a question about our collection? We're here to help.</p>
        </div>

        <div class="contact-wrapper">
            <div class="contact-form-container">
                <form action="#" class="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="What is this about?">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="How can we help you?" required></textarea>
                    </div>
                    <button type="submit" class="btn-send">Send Message</button>
                </form>
            </div>

            <div class="contact-info-container">
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <h4>Our Location</h4>
                        <p>123 Luxury Ave, Fashion District<br>Paris, France 75001</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone-alt"></i>
                    <div>
                        <h4>Call Us</h4>
                        <p>+33 1 23 45 67 89</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <h4>Email Us</h4>
                        <p>support@staticshop.com</p>
                    </div>
                </div>

                <div class="map-placeholder">
                    <img src="https://media.istockphoto.com/id/1488505221/vector/custom-location-map-interface-for-app-and-website.jpg?s=612x612&w=0&k=20&c=t77Aju71Ajo45p4agO9QzaapKFsS5BkTMWUs3-HUgnU=" alt="Map">
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
